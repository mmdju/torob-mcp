name = "torob-mcp"
main = "dist/worker.js"
account_id = "e6ad0b81fd6142add1302be356dad360"
compatibility_date = "2026-09-01"

# Keyless and stateless: no bindings and no secrets. Torob needs no login
# token and this server never signs in.
#
# The rate limiter counts each client's calls in a Durable Object so the number
# is exact and the same in every colo; without this binding the Worker falls back
# to a per-colo cache, which is weaker but never fatal.
[[durable_objects.bindings]]
name = "RATE_LIMITER"
class_name = "RateLimiter"

# Never reuse this tag for a different class: a tag is what tells Cloudflare that
# an existing object belongs to the class of the same name.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["RateLimiter"]

# One thing worth knowing: Torob's edge answers clients it scores as bots with an
# arCAPTCHA page (HTTP 490) instead of JSON, and it scores them by where the call
# comes from. Measured 2026-10-09: an ordinary connection answered every request
# shape and twelve searches 1.5s apart, while this network was challenged on its
# third call of the minute - and a Worker's subrequests carry Cloudflare's own
# `Cf-Worker` header, which cannot be stripped. See src/http.ts for how a 490 is
# turned into an actionable error rather than an empty result.
#
# Optional, for a copy that keeps being challenged: send every upstream call
# through a relay of your own. An unusable value stops the Worker with the
# reason instead of quietly falling back to Torob.
#
# [vars]
# TOROB_API_BASE = "https://relay.example"
