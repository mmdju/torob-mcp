    el.textContent = "0" + (suffix || "");
    (function step(t) {
      if (!t0) t0 = t || performance.now();
      var p = Math.min(((t || performance.now()) - t0) / dur, 1);
      var e = 1 - Math.pow(1 - p, 3);
      el.textContent = Math.round(target * e) + (suffix || "");
      if (p < 1) requestAnimationFrame(step);
    })();
  }
  window.__countUp = countUp;
  window.__statsSeen = false;
  window.__pendingStats = {};
  var __loadT = performance.now();
  function runStats() {
    if (window.__statsSeen) return;
    window.__statsSeen = true;
    var wait = Math.max(0, 1250 - (performance.now() - __loadT));
    setTimeout(function () {
      document.querySelectorAll(".statsbox [data-count]").forEach(function (el) {
        countUp(el, parseInt(el.getAttribute("data-count"), 10) || 0, el.getAttribute("data-suffix") || "");
      });
      Object.keys(window.__pendingStats).forEach(function (id) {
        countUp(document.getElementById(id), window.__pendingStats[id], "");
      });
    }, wait);
  }
  try {
    var __sb = document.querySelector(".statsbox");
    var __io = new IntersectionObserver(function (es) {
      es.forEach(function (e) { if (e.isIntersecting) { runStats(); __io.disconnect(); } });
    }, { threshold: 0.3 });
    if (__sb) __io.observe(__sb); else runStats();
  } catch (e) { setTimeout(runStats, 1500); }
  setTimeout(runStats, 4000);
  function setLiveStat(id, val) {
    var el = document.getElementById(id);
    if (window.__statsSeen) countUp(el, val, "");
    else { window.__pendingStats[id] = val; if (el) el.textContent = val; }
  }
  fetch("https://api.github.com/repos/mmdju/torob-mcp").then(function (r) { return r.json(); }).then(function (j) {
    if (j && j.stargazers_count != null) {
      document.getElementById("stars").textContent = "★ " + j.stargazers_count;
      setLiveStat("stStars", j.stargazers_count);
      if (j.forks_count != null) setLiveStat("stForks", j.forks_count);
    }
  }).catch(function () {});
  var FA_LINES = window.__lines.slice();
  var EN_LINES = [
    "The bridge between Torob and your AI.",

    "Read-only — no key, no login."
  ];
  var HEALTH_OK_EN = "Service is live", STATS_EN = "15 tools · prices in Toman", NOTE_EN = "Independent project — not affiliated with Torob · quick-test copy: rate limited, and paused from time to time", SHARE_EN = "Share", SHARED_EN = "Link copied", GH_EN = "GitHub", VER_EN = " · v", QR_EN = "QR", QRH_EN = "Scan with your phone", QRCOPY_EN = "Copy link", QRCLOSE_EN = "Close";
  var HEALTH_OK_FA = "سرویس زنده است", STATS_FA = "۱۵ ابزار · قیمت به تومان", NOTE_FA = "پروژه‌ای مستقل — وابسته به ترب نیست · نسخهٔ تستی سریع: محدودیت داره و هر چند وقت متوقف می‌شه", SHARE_FA = "اشتراک", SHARED_FA = "پیوند کپی شد", GH_FA = "گیت‌هاب", VER_FA = " · نسخه ", QR_FA = "کیوآر", QRH_FA = "اسکن با گوشی", QRCOPY_FA = "کپی پیوند", QRCLOSE_FA = "بستن";
  var STATH_EN = "Project stats", STATH_FA = "آمار پروژه", STST_EN = "Stars", STST_FA = "استار", STFK_EN = "Forks", STFK_FA = "فورک", STTL_EN = "Tools", STTL_FA = "ابزار", STVR_EN = "Version", STVR_FA = "نسخه";
  var isEn = false;
  document.getElementById("langB").addEventListener("click", function () {
    isEn = !isEn;
    var L = document.documentElement;
    L.lang = isEn ? "en" : "fa";
    L.dir = isEn ? "ltr" : "rtl";
    document.title = "Torob MCP";
    document.getElementById("langB").textContent = isEn ? "FA" : "EN";

    document.getElementById("shareT").textContent = isEn ? SHARE_EN : SHARE_FA;
    document.getElementById("qrT").textContent = isEn ? QR_EN : QR_FA;
    document.getElementById("qrH").textContent = isEn ? QRH_EN : QRH_FA;
    document.getElementById("qrCopyT").textContent = isEn ? QRCOPY_EN : QRCOPY_FA;
    document.getElementById("qrCloseT").textContent = isEn ? QRCLOSE_EN : QRCLOSE_FA;
    document.getElementById("darkT").textContent = isEn ? (document.body.classList.contains("dark") ? "Light" : "Dark") : (document.body.classList.contains("dark") ? "روشن" : "تیره");
    window.__lines = isEn ? EN_LINES : FA_LINES;
    window.__lineIdx = 0;
    document.getElementById("bugL").textContent = isEn ? "Report a bug" : "گزارش باگ";
    document.getElementById("statsH").textContent = isEn ? STATH_EN : STATH_FA;
    document.getElementById("stStarsK").textContent = isEn ? STST_EN : STST_FA;
    document.getElementById("stForksK").textContent = isEn ? STFK_EN : STFK_FA;

    document.getElementById("stVersK").textContent = isEn ? STVR_EN : STVR_FA;
    if (window.__startTyping) window.__startTyping();
    else document.querySelector(".sub").textContent = window.__lines[0];
    var dot = document.getElementById("dot");

      var v = matchMedia("(pointer: coarse)").matches || innerWidth <= 520 ? "" : document.getElementById("healthT").textContent.replace(/.*[vVنسخه]\s?/, "");
      document.getElementById("healthT").textContent = (isEn ? HEALTH_OK_EN : HEALTH_OK_FA) + (v ? (isEn ? VER_EN : VER_FA) + v : "");
    } else if (dot.classList.contains("bad")) {
      document.getElementById("healthT").textContent = isEn ? "Service unavailable" : "سرویس در دسترس نیست";
    } else {
      document.getElementById("healthT").textContent = isEn ? "Service health" : "سلامت سرویس";
    }
  });
  try {
    if (localStorage.getItem("torob-dark") === "1") document.body.classList.add("dark");

  } catch (e) {}
  function syncDarkT() { document.getElementById("darkT").textContent = document.documentElement.lang === "en" ? (document.body.classList.contains("dark") ? "Light" : "Dark") : (document.body.classList.contains("dark") ? "روشن" : "تیره"); try { document.getElementById("tcm").content = document.body.classList.contains("dark") ? "#101014" : "#e9e9ef"; } catch (e) {} }
  syncDarkT();
  document.getElementById("darkB").addEventListener("click", function () {
    document.body.classList.toggle("dark");
    try { localStorage.setItem("torob-dark", document.body.classList.contains("dark") ? "1" : "0"); } catch (e) {}
    syncDarkT();
  });
